name: Render lecture images

on:
  workflow_dispatch:
  schedule:
    # Starts shortly before the 11:30 lecture and follows Indianapolis DST changes.
    - cron: "10 11 * * *"
      timezone: "America/Indiana/Indianapolis"

permissions: {}

concurrency:
  group: lecture-images-pages
  cancel-in-progress: true

jobs:
  render:
    # This repository's self-hosted runner is the instructor's Mac. Rendering
    # there gives Google Slides the same installed fonts and metrics as the
    # authoring view, including Arial Unicode MS fallback glyphs.
    runs-on: [self-hosted, macOS, cse10124-slides]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install render dependencies
        run: |
          command -v brew >/dev/null
          brew list poppler >/dev/null 2>&1 || brew install poppler
          python3 -m venv "${RUNNER_TEMP}/lecture-images-venv"
          echo "${RUNNER_TEMP}/lecture-images-venv/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/lecture-images-venv/bin/python3" -m pip install \
            --disable-pip-version-check \
            gdown==6.1.0 \
            pillow==11.3.0 \
            playwright==1.55.0 \
            reportlab==4.4.3

      - name: Verify native Mac renderer
        run: |
          test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          test -f "/System/Library/Fonts/Supplemental/Arial Unicode.ttf"

      - name: Process newly uploaded filled slides
        env:
          NOTABILITY_SYNC_TOKEN: ${{ secrets.NOTABILITY_SYNC_TOKEN }}
          SYNC_URL: ${{ vars.SLIDE_MANIFEST_URL }}
        run: |
          test -n "${NOTABILITY_SYNC_TOKEN}"
          test -n "${SYNC_URL}"
          response="$(
            jq -nc \
              --arg token "${NOTABILITY_SYNC_TOKEN}" \
              '{token: $token, action: "prepare_filled"}' |
              curl -fsSL \
                -H "Content-Type: application/json" \
                --data-binary @- \
                "${SYNC_URL}"
          )"
          printf '%s' "${response}" | jq -e '.ok == true'

      - name: Download filled slides
        run: |
          mkdir -p "${RUNNER_TEMP}/filled-slides"
          python3 -m gdown --folder \
            "https://drive.google.com/drive/folders/1OmhQw15XUHrIFzpqWUNaBGixsEY9681u" \
            --output "${RUNNER_TEMP}/filled-slides"

      - name: Render lecture images
        env:
          SLIDE_MANIFEST_URL: ${{ vars.SLIDE_MANIFEST_URL }}
        run: |
          test -n "${SLIDE_MANIFEST_URL}"
          python3 scripts/render_lecture_images.py \
            --filled-dir "${RUNNER_TEMP}/filled-slides" \
            --slide-manifest-url "${SLIDE_MANIFEST_URL}" \
            --chromium-executable \
              "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
            --previous-output-manifest-url \
              "https://williamtheisen.com/nd-cse-10124-lectures/Lecture_Images/manifest.json"

      - name: Validate rendered site
        run: |
          test -f Lecture_Images/manifest.json
          test "$(find Lecture_Images/Notability_PDFs -name '*_Notability.pdf' -type f | wc -l)" -gt 0
          test "$(find Lecture_Images -name 'slide-*.png' -type f | wc -l)" -gt 0
          test "$(find Lecture_Images -path '*/by-id/*.png' -type f | wc -l)" \
            -eq "$(find Lecture_Images -name 'slide-*.png' -type f | wc -l)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p site/Lecture_Images
          cp -R Lecture_Images/. site/Lecture_Images/
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Sync Notability PDFs to Google Drive
        env:
          NOTABILITY_SYNC_TOKEN: ${{ secrets.NOTABILITY_SYNC_TOKEN }}
          SYNC_URL: ${{ vars.SLIDE_MANIFEST_URL }}
        run: |
          test -n "${NOTABILITY_SYNC_TOKEN}"
          test -n "${SYNC_URL}"

          for attempt in 1 2 3 4 5 6; do
            response="$(
              jq -nc \
                --arg token "${NOTABILITY_SYNC_TOKEN}" \
                --arg revision "${GITHUB_SHA}" \
                '{token: $token, revision: $revision}' |
                curl -fsSL \
                  -H "Content-Type: application/json" \
                  --data-binary @- \
                  "${SYNC_URL}"
            )" || response=""

            if printf '%s' "${response}" | jq -e '.ok == true' >/dev/null 2>&1; then
              exit 0
            fi

            sleep 20
          done

          echo "Apps Script did not confirm the Google Drive sync."
          exit 1
