name: Render lecture images

on:
  workflow_dispatch:
  schedule:
    # Starts shortly before the 11:30 lecture and follows Indianapolis DST changes.
    - cron: "3 11 * * *"
      timezone: "America/Indiana/Indianapolis"
  push:
    paths:
      - "Slides/**/*.gslides"
      - "scripts/render_lecture_images.py"
      - "scripts/html_img_generator.py"
      - ".github/workflows/lecture-images.yml"

concurrency:
  group: lecture-images-pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 -m pip install --disable-pip-version-check \
            gdown==6.1.0 \
            pillow==11.3.0 \
            playwright==1.55.0 \
            reportlab==4.4.3
          python3 -m playwright install --with-deps chromium

      - name: Download filled slides
        run: |
          mkdir -p "${RUNNER_TEMP}/filled-slides"
          python3 -m gdown --folder \
            "https://drive.google.com/drive/folders/1OmhQw15XUHrIFzpqWUNaBGixsEY9681u" \
            --output "${RUNNER_TEMP}/filled-slides"

      - name: Render lecture images
        env:
          SLIDE_MANIFEST_URL: ${{ vars.SLIDE_MANIFEST_URL }}
        run: |
          test -n "${SLIDE_MANIFEST_URL}"
          python3 scripts/render_lecture_images.py \
            --filled-dir "${RUNNER_TEMP}/filled-slides" \
            --slide-manifest-url "${SLIDE_MANIFEST_URL}" \
            --previous-output-manifest-url \
              "https://williamtheisen.com/nd-cse-10124-lectures/Lecture_Images/manifest.json"

      - name: Validate rendered site
        run: |
          test -f Lecture_Images/manifest.json
          test "$(find Lecture_Images/Notability_PDFs -name '*_Notability.pdf' -type f | wc -l)" -gt 0
          test "$(find Lecture_Images -name 'slide-*.png' -type f | wc -l)" -gt 0
          test "$(find Lecture_Images -path '*/by-id/*.png' -type f | wc -l)" \
            -eq "$(find Lecture_Images -name 'slide-*.png' -type f | wc -l)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p site/Lecture_Images
          cp -R Lecture_Images/. site/Lecture_Images/
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Sync Notability PDFs to Google Drive
        env:
          NOTABILITY_SYNC_TOKEN: ${{ secrets.NOTABILITY_SYNC_TOKEN }}
          SYNC_URL: ${{ vars.SLIDE_MANIFEST_URL }}
        run: |
          test -n "${NOTABILITY_SYNC_TOKEN}"
          test -n "${SYNC_URL}"

          for attempt in 1 2 3 4 5 6; do
            response="$(
              jq -nc \
                --arg token "${NOTABILITY_SYNC_TOKEN}" \
                --arg revision "${GITHUB_SHA}" \
                '{token: $token, revision: $revision}' |
                curl -fsSL \
                  -H "Content-Type: application/json" \
                  --data-binary @- \
                  "${SYNC_URL}"
            )" || response=""

            if printf '%s' "${response}" | jq -e '.ok == true' >/dev/null 2>&1; then
              exit 0
            fi

            sleep 20
          done

          echo "Apps Script did not confirm the Google Drive sync."
          exit 1
