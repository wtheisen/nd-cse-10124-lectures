<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSE 10124 Slide Picker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">CSE 10124</p>
        <h1>Slide Picker</h1>
      </div>
      <div class="header-actions">
        <button id="github-status-control" class="icon-button github-status-button disconnected" type="button" title="Connect GitHub" aria-label="Connect GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2.24c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.71 5.38-5.29 5.67.42.36.79 1.06.79 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
          </svg>
          <span class="connection-dot" aria-hidden="true"></span>
        </button>
        <button id="refresh-manifest" class="icon-button" type="button" title="Refresh slides" aria-label="Refresh slides">↻</button>
      </div>
    </header>

    <main>
      <section class="deck-controls" aria-labelledby="deck-label">
        <div class="field-row">
          <label id="deck-label" for="deck-select">Deck</label>
          <span id="inference-status" class="muted"></span>
        </div>
        <select id="deck-select"></select>
      </section>

      <section id="notice" class="notice" hidden></section>

      <section class="selection-bar">
        <div>
          <strong id="selection-count">No slides selected</strong>
          <span class="muted">Click thumbnails in paste order.</span>
        </div>
        <button id="clear-selection" class="text-button" type="button" disabled>Clear</button>
      </section>

      <section id="slide-grid" class="slide-grid" aria-live="polite"></section>

      <section class="copy-panel">
        <button id="copy-selected" class="primary-button" type="button" disabled>
          Select slides to copy
        </button>
        <p class="microcopy">Horizontal rules are inserted between selected slides.</p>
      </section>

      <section class="generator-panel" aria-labelledby="generator-heading">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">GitHub Actions</p>
            <h2 id="generator-heading">Image generator</h2>
          </div>
          <span id="run-badge" class="status-badge idle">Idle</span>
        </div>
        <p id="run-description" class="muted">Connect GitHub to regenerate and publish slide images.</p>
        <div class="button-row">
          <button id="connect-github" class="secondary-button" type="button">Connect GitHub</button>
          <button id="run-generator" class="secondary-button" type="button" disabled>Regenerate images</button>
          <button id="disconnect-github" class="text-button" type="button" hidden>Disconnect</button>
        </div>
        <a id="view-run" class="run-link" href="#" target="_blank" hidden>View workflow run ↗</a>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
